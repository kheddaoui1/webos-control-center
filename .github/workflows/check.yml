name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No npm install: `npm run check` is pure `node --check` and needs no dependencies.
      - run: npm run check
